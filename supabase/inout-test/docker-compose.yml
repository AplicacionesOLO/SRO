version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: inout-test-db
    environment:
      POSTGRES_USER: inout_test
      POSTGRES_PASSWORD: inout_test_local_only
      POSTGRES_DB: inout_test
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - ../../:/app:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout_test -d inout_test"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"